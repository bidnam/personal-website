<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bidnam Lee - Strategic Terrain</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <p class="name">Bidnam Lee</p>
      <h1 class="headline">I help companies figure out who they need to be <em>to win</em>.</h1>
    </header>

    <div id="canvas-container"></div>

    <svg id="lines-overlay" width="100%" height="100%">
      <line class="peak-line" data-peak="about"></line>
      <line class="peak-line" data-peak="work"></line>
      <line class="peak-line" data-peak="writing"></line>
      <line class="peak-line" data-peak="contact"></line>
    </svg>

    <nav class="nav-labels">
      <button class="nav-label" data-peak="about">About</button>
      <button class="nav-label" data-peak="work">Work</button>
      <button class="nav-label" data-peak="writing">Writing</button>
      <button class="nav-label" data-peak="contact">Contact</button>
    </nav>

    <div class="peak-label" data-peak="about">About</div>
    <div class="peak-label" data-peak="work">Work</div>
    <div class="peak-label" data-peak="writing">Writing</div>
    <div class="peak-label" data-peak="contact">Contact</div>

    <p class="hint">Drag to spin · Arrow keys to navigate</p>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Main Script -->
  <script src="js/main.js"></script>
</body>
</html>
